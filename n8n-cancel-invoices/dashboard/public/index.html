<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>متابعة الفواتير الملغية</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #f1f5f9; }
  header { background: #1e293b; color: #fff; padding: 16px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .cards { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 10px; padding: 16px 20px; min-width: 150px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card b { font-size: 28px; display: block; }
  .filters { display: flex; gap: 10px; padding: 0 24px 16px; flex-wrap: wrap; }
  .filters input, .filters select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
  button { padding: 8px 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  table { width: calc(100% - 48px); margin: 0 24px 24px; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; text-align: right; font-size: 14px; }
  th { background: #f8fafc; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; }
  .badge.wait { background: #fef3c7; color: #92400e; }
  .badge.done { background: #dcfce7; color: #166534; }
</style>
</head>
<body>
<header>
  <h2 style="margin:0">📋 متابعة الفواتير الملغية والتعويضات</h2>
  <div><button onclick="load()">🔄 تحديث</button> <button onclick="exportCSV()">⬇️ تصدير CSV</button> <button onclick="window.print()">🖨️ طباعة</button></div>
</header>
<div class="cards">
  <div class="card">إجمالي الملغية<b id="cTotal">0</b></div>
  <div class="card">تم تعويضها<b id="cDone" style="color:#16a34a">0</b></div>
  <div class="card">بانتظار التعويض<b id="cWait" style="color:#d97706">0</b></div>
</div>
<div class="filters">
  <input id="fBranch" placeholder="الفرع..." oninput="render()">
  <select id="fStatus" onchange="render()"><option value="">كل الحالات</option><option>بانتظار التعويض</option><option>تم التعويض</option></select>
  <input id="fFrom" type="date" onchange="render()">
  <input id="fTo" type="date" onchange="render()">
  <input id="fSearch" placeholder="بحث برقم الفاتورة..." oninput="render()">
</div>
<table>
  <thead><tr><th>التاريخ</th><th>الفرع</th><th>رقم الفاتورة</th><th>السبب</th><th>الكاشير</th><th>حالة التعويض</th><th>وقت التعويض</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
let allRows = [];
async function load() {
  const r = await fetch('/api/data');
  const d = await r.json();
  allRows = d.rows || [];
  render();
}
function filtered() {
  const b = document.getElementById('fBranch').value.trim();
  const s = document.getElementById('fStatus').value;
  const from = document.getElementById('fFrom').value;
  const to = document.getElementById('fTo').value;
  const q = document.getElementById('fSearch').value.trim();
  return allRows.filter(r =>
    (!b || (r['الفرع']||'').includes(b)) &&
    (!s || r['حالة التعويض'] === s) &&
    (!q || String(r['رقم الفاتورة']||'').includes(q)) &&
    (!from || (r['التاريخ']||'').slice(0,10) >= from) &&
    (!to || (r['التاريخ']||'').slice(0,10) <= to)
  );
}
function render() {
  const rows = filtered();
  document.getElementById('cTotal').textContent = rows.length;
  document.getElementById('cDone').textContent = rows.filter(r => r['حالة التعويض'] === 'تم التعويض').length;
  document.getElementById('cWait').textContent = rows.filter(r => r['حالة التعويض'] !== 'تم التعويض').length;
  document.getElementById('rows').innerHTML = rows.map(r => `<tr>
    <td>${(r['التاريخ']||'').slice(0,16).replace('T',' ')}</td>
    <td>${r['الفرع']||''}</td><td>${r['رقم الفاتورة']||''}</td><td>${r['السبب']||''}</td>
    <td>${r['الكاشير']||''}</td>
    <td><span class="badge ${r['حالة التعويض']==='تم التعويض'?'done':'wait'}">${r['حالة التعويض']||''}</span></td>
    <td>${(r['وقت التعويض']||'').slice(0,16).replace('T',' ')}</td></tr>`).join('');
}
function exportCSV() {
  const rows = filtered();
  const cols = ['التاريخ','الفرع','رقم الفاتورة','السبب','الكاشير','حالة التعويض','وقت التعويض'];
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => `"${(r[c]||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'cancelled-invoices.csv'; a.click();
}
load();
</script>
</body>
</html>
