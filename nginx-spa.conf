server {
    # Both stacks: in the alpine image /etc/hosts maps `localhost` to ::1 first,
    # and busybox wget resolves IPv6 first — with an IPv4-only listener every
    # `http://localhost/` healthcheck failed with "Connection refused" even
    # though the site served fine on 0.0.0.0.
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # Security headers (P1-3)
    # ============================================================
    # This file serves index.html and every SPA route, so THESE headers — not
    # the ones in server/index.js — are what actually protect the rendered app.
    # Previously nginx sent none of them: the API responses carried a CSP while
    # the HTML/JS the browser executes carried no policy at all.
    #
    # ⚠️ nginx `add_header` INHERITANCE: directives declared inside a `location`
    #    REPLACE the server-level set for that location. `location /assets/`
    #    declares its own Cache-Control, so the whole security block is repeated
    #    there — otherwise every JS/CSS bundle would ship without CSP.
    #
    # `always` makes the headers apply to error responses too (a 404 from the
    # SPA fallback would otherwise be unstyled-and-unprotected).
    #
    # HSTS is deliberately inert over plain HTTP — browsers ignore it unless the
    # response arrived over HTTPS — so it cannot lock anyone out of a local
    # http:// deployment, and activates by itself behind a TLS terminator.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://generativelanguage.googleapis.com https://api.groq.com https://openrouter.ai https://api.openai.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ------------------------------------------------------------
    # API proxy (CRITICAL — the deployment was non-functional without it)
    # ------------------------------------------------------------
    # The frontend calls its backend with relative URLs only (58 call sites,
    # every one of them `/api/...`), so the browser resolves them against
    # whatever origin served index.html. Without a proxy, `location /` matched
    # `/api/...` first and the SPA fallback rewrote it to index.html —
    # verified from the page: fetch('/api/health') returned
    # `200 text/html "<!doctype html>..."` instead of JSON. Every login, sync
    # and save would therefore have failed with a JSON parse error while all
    # three containers reported healthy and `curl .../api/health` on port 3033
    # looked fine, because that path was never exercised through nginx.
    #
    # proxy_pass without a trailing URI passes the original path unchanged
    # (`/api/health` -> `http://server:3033/api/health`).
    #
    # `resolver` + a variable forces nginx to resolve `server` AT REQUEST TIME
    # (cached 10s) instead of once at startup. Without it nginx pins whatever
    # IP `server` had when web booted, and a `docker compose up -d
    # --force-recreate server` would silently break every API call until web
    # was restarted too. 127.0.0.11 is Docker's embedded DNS.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://server:3033;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # express.json({ limit: '20mb' }) is the real ceiling; nginx's default
        # client_max_body_size is 1m and would 413 a restore/upload first.
        client_max_body_size 25m;

        # Backup/restore and report export stream their bodies; buffering would
        # hold the whole payload in memory before the client sees a byte.
        proxy_buffering off;

        # PDF/Excel generation and backups can exceed the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Liveness/readiness endpoints the operator (and any load balancer) hits on
    # the public origin rather than on the backend port. Same runtime resolver
    # as /api/ so they survive a backend container being recreated.
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://server:3033;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
    }
    location = /ready {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://server:3033;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
    }

    # SPA fallback: all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated here on purpose — see the inheritance warning above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://generativelanguage.googleapis.com https://api.groq.com https://openrouter.ai https://api.openai.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
