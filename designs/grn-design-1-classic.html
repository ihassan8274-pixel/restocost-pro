<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إشعار استلام جديد - تصميم 1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f5f5f5; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
.header { background: linear-gradient(135deg, #172033 0%, #1e293b 100%); color: #fff; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .actions { display: flex; gap: 10px; }
.btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.btn-primary { background: #D7A928; color: #fff; }
.btn-primary:hover { background: #c49a22; }
.btn-secondary { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3); }
.btn-secondary:hover { background: rgba(255,255,255,0.1); }
.content { padding: 30px; }
.section { margin-bottom: 25px; }
.section-title { font-size: 14px; font-weight: 600; color: #172033; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #D7A928; display: inline-block; }
.form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 15px; }
.form-group { display: flex; flex-direction: column; }
.form-group label { font-size: 12px; color: #64748b; margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group select { padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: #D7A928; box-shadow: 0 0 0 3px rgba(215,169,40,0.1); }
.items-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.items-table th { background: #f8fafc; padding: 12px; text-align: right; font-size: 12px; color: #64748b; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
.items-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
.items-table input { width: 100%; padding: 8px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 13px; }
.items-table input:focus { outline: none; border-color: #D7A928; }
.add-item { margin-top: 15px; padding: 10px 20px; background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 6px; cursor: pointer; color: #64748b; font-size: 14px; width: 100%; transition: all 0.2s; }
.add-item:hover { border-color: #D7A928; color: #D7A928; background: #fffbeb; }
.summary { background: #f8fafc; border-radius: 8px; padding: 20px; margin-top: 20px; }
.summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
.summary-row.total { border-top: 2px solid #e2e8f0; margin-top: 10px; padding-top: 15px; font-weight: 600; font-size: 16px; color: #172033; }
.summary-row .label { color: #64748b; }
.summary-row .value { font-weight: 500; }
.delete-btn { color: #ef4444; cursor: pointer; background: none; border: none; font-size: 16px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>إشعار استلام جديد</h1>
    <div class="actions">
      <button class="btn btn-secondary">إلغاء</button>
      <button class="btn btn-primary">حفظ الإشعار</button>
    </div>
  </div>
  <div class="content">
    <div class="section">
      <div class="section-title">معلومات أساسية</div>
      <div class="form-row">
        <div class="form-group">
          <label>رقم الإشعار</label>
          <input type="text" value="GRN-2026-0049" readonly style="background: #f8fafc;">
        </div>
        <div class="form-group">
          <label>التاريخ</label>
          <input type="date" value="2026-09-30">
        </div>
        <div class="form-group">
          <label>الفرع</label>
          <select>
            <option>الفرع الأول - الرياض</option>
            <option>الفرع الثاني - جدة</option>
            <option>الفرع الثالث - الدمام</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>المورد</label>
          <select>
            <option>شركة الأغذية المتحدة</option>
            <option>مؤسسة النور للتجارة</option>
            <option>شركة الخليج للتوريدات</option>
          </select>
        </div>
        <div class="form-group">
          <label>رقم الفاتورة</label>
          <input type="text" placeholder="اختياري">
        </div>
        <div class="form-group">
          <label>تاريخ الفاتورة</label>
          <input type="date">
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">بنود الإشعار</div>
      <table class="items-table">
        <thead>
          <tr>
            <th>#</th>
            <th>الصنف</th>
            <th>الكمية</th>
            <th>الوحدة</th>
            <th>سعر الوحدة</th>
            <th>الإجمالي</th>
            <th>الدفعة</th>
            <th>تاريخ الانتهاء</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td><select style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:4px;"><option>دقيق أبيض</option><option>زيت دوار</option><option>سكر ناعم</option></select></td>
            <td><input type="number" value="50"></td>
            <td>كغ</td>
            <td><input type="number" value="12.50" step="0.01"></td>
            <td style="font-weight:600;">625.00</td>
            <td><input type="text" value="B-001"></td>
            <td><input type="date" value="2027-01-15"></td>
            <td><button class="delete-btn">×</button></td>
          </tr>
          <tr>
            <td>2</td>
            <td><select style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:4px;"><option>زيت دوار</option><option>دقيق أبيض</option><option>سكر ناعم</option></select></td>
            <td><input type="number" value="20"></td>
            <td>لتر</td>
            <td><input type="number" value="18.00" step="0.01"></td>
            <td style="font-weight:600;">360.00</td>
            <td><input type="text" value="B-002"></td>
            <td><input type="date" value="2026-12-01"></td>
            <td><button class="delete-btn">×</button></td>
          </tr>
        </tbody>
      </table>
      <button class="add-item">+ إضافة بند جديد</button>
    </div>
    <div class="summary">
      <div class="summary-row">
        <span class="label">الإجمالي قبل الضريبة</span>
        <span class="value">985.00 ر.س</span>
      </div>
      <div class="summary-row">
        <span class="label">ضريبة القيمة المضافة (15%)</span>
        <span class="value">147.75 ر.س</span>
      </div>
      <div class="summary-row total">
        <span class="label">الإجمالي شامل الضريبة</span>
        <span class="value">1,132.75 ر.س</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
